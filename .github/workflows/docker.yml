name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
          [[ "$GITHUB_REF_TYPE" == "tag" ]] && V="${GITHUB_REF_NAME#v}" || V="dev"
          echo "APP_VERSION=$V" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.REPO_LC }}
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Déploiement et Test de fumée (Staging)
        run: |
          REPO_LC=${GITHUB_REPOSITORY,,}
          # On utilise le tag dynamique sha-xxxxxxx généré lors du build
          IMAGE="ghcr.io/$REPO_LC:sha-${GITHUB_SHA::7}"

          echo "Lancement de l'image : $IMAGE"
          docker run -d -p 8000:8000 $IMAGE

          echo "Attente du démarrage de l'application..."
          sleep 5

          # Test de fumée avec tentatives multiples (retry)
          curl -f --retry 5 --retry-connrefused --retry-delay 2 http://localhost:8000/health
          curl -f --retry 5 --retry-connrefused --retry-delay 2 http://localhost:8000/version

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Déploiement et Test de fumée (Production)
        run: |
          REPO_LC=${GITHUB_REPOSITORY,,}
          # En production, on utilise la version propre extraite du tag Git (ex: 0.1.1)
          VERSION=${GITHUB_REF_NAME#v}
          IMAGE="ghcr.io/$REPO_LC:$VERSION"

          echo "Lancement de l'image release : $IMAGE"
          docker run -d -p 8000:8000 $IMAGE

          echo "Attente du démarrage de l'application..."
          sleep 5

          curl -f --retry 5 --retry-connrefused --retry-delay 2 http://localhost:8000/health
          curl -f --retry 5 --retry-connrefused --retry-delay 2 http://localhost:8000/version

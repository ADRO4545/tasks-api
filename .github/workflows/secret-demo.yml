name: secret-demo
on:
  workflow_dispatch:
jobs:
  secretdemo:
    runs-on: ubuntu-latest
    steps:
      - name: Affichage et test du secret
        env:
          DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: |
          if [ -z "$DEMO_TOKEN" ]; then
            echo "Erreur : le secret DEMO_TOKEN est vide."
            exit 1
            fi

          echo "La longueur du token est : ${#DEMO_TOKEN}"
          echo "Test du secret : $DEMO_TOKEN"

          echo "Environnement : ${{ vars.APP_ENV }}"
